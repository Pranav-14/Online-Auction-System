name: LocalLoop CI Pipeline

on:
  push:
    branches: [ main, revamp, "feature/**" ]
  pull_request:
    branches: [ main, revamp ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auction_db
          POSTGRES_USER: auction_user
          POSTGRES_PASSWORD: auction_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: Code Style Check (Black & Flake8)
        run: |
          black --check .
          flake8 . --exclude=venv,env,.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Django Tests
        env:
          DEBUG: 'True'
          SECRET_KEY: 'ci-secret-key-for-testing'
          USE_SQLITE: 'True'
        run: |
          python manage.py test
