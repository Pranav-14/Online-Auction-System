{% extends "auctions/layout.html" %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">📱 Mobile OTP Login / Registration</h2>
        <p class="text-muted">Enter your 10-digit Indian mobile number (+91) to receive a 6-digit OTP code.</p>

        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}

        <form action="{% url 'request_otp' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="phone_number">Indian Mobile Number</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">+91</span>
                    </div>
                    <input autofocus class="form-control" type="text" id="phone_number" name="phone_number" placeholder="9876543210" required pattern="[0-9]{10}">
                </div>
            </div>
            <button class="btn btn-success btn-block" type="submit">Send OTP Code</button>
        </form>

        <div class="mt-3 text-center">
            <a href="{% url 'login' %}">Back to Username Login</a>
        </div>
    </div>
</div>
{% endblock %}
