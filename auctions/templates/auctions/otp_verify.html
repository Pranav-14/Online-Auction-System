{% extends "auctions/layout.html" %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">🔑 Enter Verification Code</h2>
        <p class="text-muted">A 6-digit OTP has been sent to <strong>{{ phone_number }}</strong>.</p>

        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}

        <form action="{% url 'verify_otp' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="otp_code">6-Digit OTP Code</label>
                <input autofocus class="form-control text-center" style="font-size: 1.5rem; letter-spacing: 0.5rem;" type="text" id="otp_code" name="otp_code" placeholder="123456" required maxlength="6" pattern="[0-9]{6}">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Verify OTP & Log In</button>
        </form>

        <div class="mt-3 text-center">
            <a href="{% url 'request_otp' %}">Change Mobile Number / Resend OTP</a>
        </div>
    </div>
</div>
{% endblock %}
